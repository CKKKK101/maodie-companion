<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耄耋成长档案</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#342c23;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}.app{padding:24px;max-width:520px;margin:auto}header{display:flex;align-items:center;justify-content:space-between}header strong{font-size:21px;letter-spacing:1px}.tag{font-size:10px;color:#64784e;background:#e8efdc;border:1px solid #cedbbb;padding:5px 9px;border-radius:20px}.subtitle{color:#928675;font-size:11px;margin:8px 0 0}.pet-scene{height:218px;margin:18px 0 0;border:1px solid #e5ddcc;border-radius:18px;background:radial-gradient(ellipse at 50% 85%,#e8dcc4,transparent 65%),#f4efe4;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.pet-scene video{width:228px;height:228px;object-fit:contain}.mood{position:absolute;top:12px;left:13px;font-size:11px;color:#826548}.level{position:absolute;top:12px;right:13px;font-size:11px;color:#64784e}.speech{min-height:46px;padding:12px 3px 8px;line-height:1.7;font-size:12px;color:#806344}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:white;border:1px solid #e4ddcf;border-radius:10px;padding:11px 12px}.stat small{display:block;font-size:10px;color:#968773}.stat b{display:block;font:700 24px 'Segoe UI',sans-serif;margin-top:5px;color:#566b3e}.stat em{font-size:10px;color:#9c8d7b;font-style:normal}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:15px}button{font:inherit;cursor:pointer;border:1px solid #d9cfbd;background:#fffdf9;color:#5c4934;border-radius:9px;padding:11px 4px;font-size:12px}button:hover{background:#efe7d6}button:focus-visible{outline:2px solid #6b8a4b;outline-offset:2px}button:disabled{opacity:.45;cursor:default}.focus{margin-top:15px;padding:14px;background:#eef1e5;border:1px solid #d8dfc7;border-radius:12px}.focus-head{display:flex;justify-content:space-between;font-size:11px;color:#71805d}.timer{font-size:27px;font-variant-numeric:tabular-nums;font-weight:650;color:#52693d;margin:7px 0 11px}.focus-actions{display:flex;gap:7px}.focus-actions button{padding:9px 10px;font-size:10px;background:#f9fcf3;border-color:#c9d4b7}.focus-actions button:first-child{background:#627b49;color:white;border-color:#627b49}.note{font-size:9px;color:#9b8f7c;line-height:1.8;margin-top:11px}.error{color:#ae5642;font-size:11px;min-height:18px;margin-top:8px}.footer{font-size:9px;color:#ad9c85;text-align:center;margin-top:10px}.recent{font-size:10px;color:#95836d;margin:8px 0;min-height:15px}
</style></head><body><main class="app"><header><strong>耄耋成长档案</strong><span class="tag">本地存档</span></header><p class="subtitle">这只猫会记仇，也会慢慢熟悉你。</p><section class="pet-scene"><span class="mood" id="mood">连接中</span><span class="level" id="level">Lv.1</span><video id="petVideo" autoplay loop muted playsinline src="/art/待机"></video></section><div class="speech" id="speech">轻轻摸一下，或者给它一份食物。</div><div class="stats"><div class="stat"><small>熟悉度</small><b id="affinity">—</b><em>/ 100</em></div><div class="stat"><small>烦躁值</small><b id="irritation">—</b><em>/ 100</em></div><div class="stat"><small>食物</small><b id="food">—</b><em>份</em></div></div><div class="actions"><button data-event="poke">轻轻摸头</button><button data-event="feed">喂一份食物</button><button data-event="play">陪它玩一会</button></div><div class="recent" id="recent"></div><button data-event="book-open">打开记忆与成长</button><section class="focus"><div class="focus-head"><span>专注陪伴</span><span id="focusLabel">未开始</span></div><div class="timer" id="timer">25:00</div><div class="focus-actions"><button data-event="focus-start" id="startFocus">专注25分钟</button><button data-event="focus-toggle" id="toggleFocus">暂停 / 继续</button><button data-event="focus-cancel" id="cancelFocus">取消</button><button data-event="focus-demo" id="demoFocus">30秒演示</button></div><div class="note">正式专注完成获得1份食物；30秒演示不计奖励。<br>5秒内连续摸三次会哈气，喂食可以和好。</div></section><div class="error" id="error" role="alert"></div><div class="footer">记忆与成长保存在本机 · 聊天连接 DeepSeek</div></main><script>
const $=id=>document.getElementById(id);let state=null,videoName='待机',eventQueue=Promise.resolve();
function draw(s){state=s;$('affinity').textContent=s.affinity;$('irritation').textContent=s.irritation;$('food').textContent=s.food;$('level').textContent=s.relationship?.name||('Lv.'+s.level);$('mood').textContent=s.mood;
if(s.action&&s.action.until>Date.now())$('speech').textContent=s.action.text;
const running=s.focus?.status==='active',paused=s.focus?.status==='paused',seconds=Math.ceil((s.focusRemainingMs||0)/1000);$('timer').textContent=running||paused?String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'):'25:00';$('focusLabel').textContent=running?(s.focus.demo?'演示中 · 无奖励':'专注中'):paused?'已暂停':s.focus?.status==='completed'?'本次已完成':'未开始';$('startFocus').disabled=running||paused;$('demoFocus').disabled=running||paused;$('toggleFocus').disabled=!running&&!paused;$('cancelFocus').disabled=!running&&!paused;
const animation=running?'睡觉':s.action?.until>Date.now()&&s.action.animation?s.action.animation:s.angry?'飞机耳':'待机';if(animation!==videoName){videoName=animation;$('petVideo').src='/art/'+encodeURIComponent(animation);$('petVideo').play().catch(()=>{});}const last=s.history.at(-1);$('recent').textContent=last?'最近：'+last.detail:'先慢慢认识一下。';}
async function sync(){try{const r=await fetch('/state',{cache:'no-store'});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.message);draw(data.state);$('error').textContent='';}catch{$('error').textContent='养成服务暂时断开，请重新打开面板。';}}
for(const button of document.querySelectorAll('[data-event]'))button.onclick=()=>{eventQueue=eventQueue.then(async()=>{try{const r=await fetch('/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:button.dataset.event,source:'panel'})});const data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.message);draw(data.state);$('error').textContent='';}catch(e){$('error').textContent=e.message;}});};
setInterval(sync,700);sync();
</script></body></html>
