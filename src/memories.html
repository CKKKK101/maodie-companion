<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>耄耋记忆与成长</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#302f29;font:15px/1.7 'Microsoft YaHei UI','Microsoft YaHei',sans-serif}main{max-width:620px;padding:24px;margin:auto}h1{font-size:23px;margin:0}h2{font-size:18px;margin:24px 0 10px}.muted{color:#78796d;font-size:12px}nav{display:flex;gap:8px;margin:20px 0}button{font:inherit;cursor:pointer;border:1px solid #d5dccb;border-radius:8px;background:white;color:#405334;padding:7px 12px;font-size:13px}button:hover{background:#edf3e7}button:disabled{opacity:.5;cursor:default}nav button.active{background:#607c48;color:white}section[hidden]{display:none}.card{background:#fff;border:1px solid #e1e2d7;border-radius:12px;padding:15px;margin:12px 0}.card b{display:block}.card p{margin:8px 0;overflow-wrap:anywhere}.card small{color:#78796d}details{color:#707568;font-size:12px}summary{cursor:pointer}input[type=text],textarea{width:100%;font:inherit;border:1px solid #cbd5c2;border-radius:8px;padding:9px;background:#fff}textarea{min-height:88px;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.danger{color:#9b4b37}.bar{height:9px;background:#e6e9df;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#78965c}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px}.stages span{padding:8px;text-align:center;border-radius:8px;background:#eeeee6}.stages .active{background:#dfeccc;color:#3d5b2c;font-weight:700}#status{min-height:24px;font-size:12px;color:#58743e;white-space:pre-wrap}.empty{color:#8a8d80}.tog{display:flex;align-items:center;gap:9px}label{display:block;font-size:13px;margin-bottom:6px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #759655;outline-offset:2px}</style>
<main><h1>它在慢慢记住你</h1><div class="muted">长期档案 · 共同回忆 · 我们的关系</div><nav><button data-tab="facts" class="active">它记住了什么</button><button data-tab="episodes">共同回忆</button><button data-tab="relationship">我们的关系</button></nav><div id="status" role="status"></div>
<section id="facts"><div class="card"><label for="newMemory">告诉它一件要记住的事</label><input id="newMemory" type="text" maxlength="240" placeholder="例如：我叫阿葵；我喜欢安静地被提醒"><div class="buttons"><button id="addMemory">记住这件事</button></div><p class="muted">也可以直接在聊天里说“记住，我叫……”。改口或忘记会重置近期上下文，避免旧信息再被带出来。</p></div><div id="factList"></div><div class="card"><b>开始一轮新对话</b><p class="muted" id="contextInfo"></p><button id="resetContext">清空近期上下文，保留长期档案</button><p class="muted">旧版宿主的原聊天文件未被删除；本角色的新聊天不再读取那份旧上下文。</p></div></section>
<section id="episodes" hidden><p class="muted">这些记录来自实际操作。历史计数不能证明的日期，不会编造。</p><div id="episodeList"></div></section>
<section id="relationship" hidden><div class="card"><b id="stageName"></b><p id="stageDescription"></p><div class="bar"><i id="progress"></i></div><div class="stages" id="stages"></div><p id="nextStage"></p><p class="muted" id="actions"></p></div><div class="card"><b>一时生气，也还记得你</b><p class="muted">短期烦躁会逐渐缓和，已解锁的关系与动作会保留。熟悉后仍然是一只傲娇小猫。</p><label class="tog"><input id="randomHiss" type="checkbox">空闲时偶尔耍脾气哈气</label><p class="muted">闲下来约15—30分钟才可能出现；专注、聊天或编辑待办时不随机打扰。</p></div></section><div style="margin-top:24px;text-align:center"><button data-quit>退出桌宠 · 拜拜啦</button><p class="muted">同时退出 DeepSeek Harness，记忆与成长会保存。</p></div></main>
<script>
const $=id=>document.getElementById(id);let busy=false,editing=null,tab='facts',lastFacts='';
async function api(route,method='GET',body){const r=await fetch(route,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||'暂时没有连上');return d;}
function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
async function mutate(fn,message){if(busy)return;busy=true;$('status').textContent='保存中…';try{await fn();editing=null;$('status').textContent=message;await refresh();}catch(e){$('status').textContent=e.message;}finally{busy=false;}}
function facts(list){const root=$('factList');root.replaceChildren();if(!list.length)root.append(el('p','还没有长期记忆。先告诉它，你希望被怎么称呼。','empty'));
for(const f of list){const card=el('article',undefined,'card');card.append(el('b',f.label||'记忆'));if(editing===f.id){const input=el('textarea');input.value=f.value;input.maxLength=240;input.setAttribute('aria-label','修改记忆');card.append(input);const save=el('button','保存修改'),cancel=el('button','取消');save.onclick=()=>mutate(()=>api('/memory/'+f.id,'PATCH',{value:input.value}),'已经改好，也换了一轮近期上下文。');cancel.onclick=()=>{editing=null;refresh();};const row=el('div',undefined,'buttons');row.append(save,cancel);card.append(row);}else{card.append(el('p',f.value));const evidence=el('details');evidence.append(el('summary','为什么记得这件事？'),el('p',f.evidence||'用户在档案中添加'));card.append(evidence);const row=el('div',undefined,'buttons'),edit=el('button','纠正'),remove=el('button','忘掉这条','danger');edit.onclick=()=>{editing=f.id;refresh();};remove.onclick=()=>mutate(()=>api('/memory/'+f.id,'DELETE'),'已经忘掉，也清理了近期上下文。');row.append(edit,remove);card.append(row);}root.append(card);}}
async function refresh(){if(editing&&document.activeElement?.tagName==='TEXTAREA')return;try{const [m,s]=await Promise.all([api('/memory'),api('/state')]);const state=s.state;const fingerprint=JSON.stringify([m.facts,editing]);if(fingerprint!==lastFacts){lastFacts=fingerprint;facts(m.facts);}$('contextInfo').textContent='近期对话占用 '+m.recentMessages+' / 24 条消息；清空后仍保留长期档案和成长。';const root=$('episodeList');root.replaceChildren();for(const event of [...(state.milestones||[])].reverse()){const card=el('article',undefined,'card');card.append(el('b',event.detail),el('small',new Date(event.at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'})));root.append(card);}if(!root.children.length)root.append(el('p','第一段共同经历，会从真实互动开始。','empty'));const r=state.relationship;$('stageName').textContent=r.name+' · 熟悉度 '+state.affinity+'/100';$('stageDescription').textContent=r.description;$('progress').style.width=state.affinity+'%';$('stages').replaceChildren(...['警惕','试探','认可','偏爱'].map((name,i)=>el('span',name,i===r.id?'active':'')));$('nextStage').textContent=r.next?'下一阶段「'+r.next.name+'」：还差 '+r.next.remaining+' 点熟悉度'+(r.next.needsKinds?'，还需体验 '+r.next.needsKinds+' 类不同互动':''):'你已经是它偏爱的人了。';$('actions').textContent='已解锁：'+state.unlocked.join('、');$('randomHiss').checked=state.settings.randomHiss;if(m.warning)$('status').textContent=m.warning;}catch(e){$('status').textContent=e.message;}}
for(const button of document.querySelectorAll('[data-tab]'))button.onclick=()=>{tab=button.dataset.tab;for(const name of ['facts','episodes','relationship'])$(name).hidden=name!==tab;for(const b of document.querySelectorAll('[data-tab]'))b.classList.toggle('active',b===button);refresh();};
$('addMemory').onclick=()=>mutate(async()=>{await api('/memory','POST',{text:$('newMemory').value});$('newMemory').value='';},'记住了，依据会保留在卡片里。');$('resetContext').onclick=()=>mutate(()=>api('/context/reset','POST',{}),'新一轮对话已准备好，长期记忆仍在。');$('randomHiss').onchange=()=>mutate(()=>api('/event','POST',{type:'settings',randomHiss:$('randomHiss').checked}),'设置已保存。');setInterval(()=>{if(!busy&&!editing)refresh();},4000);refresh();
</script><script src="/exit-ui.js"></script></html>
